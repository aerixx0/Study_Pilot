name: StudyPilot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai-agent-ai-agent-studypilot/outputs/StudyPilot
    env:
      ZHIPU_API_KEY: ""
      SILICONFLOW_API_KEY: ""
      STUDYPILOT_TEST_POSTGRES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q studypilot app.py
      - run: |
          for script in public/*.js; do node --check "$script"; done
          node tests/test_workflow.cjs
