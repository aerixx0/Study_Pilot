<text x="1286" y="515" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C3CCDA">The server validates</text>
<text x="1286" y="545" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C3CCDA">and saves the change.</text>
