<text x="64" y="126" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="600" fill="#FAFBFF">AI proposes. You approve.</text>
<text x="65" y="213" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#C3CCDA">A clear boundary between conversation and saved changes.</text>
