<text x="986" y="515" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C3CCDA">Approve the change</text>
<text x="986" y="545" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C3CCDA">on its proposal card.</text>
<rect x="984" y="594" width="230" height="50" rx="10" fill="#07090D" stroke="#394456"/>
<path d="M996 617.64 L1002.48 623.76" fill="none" stroke="#83DDC1" stroke-width="3" stroke-linecap="round"/>
<path d="M1002.48 623.76 L1014 609" fill="none" stroke="#83DDC1" stroke-width="3" stroke-linecap="round"/>
