<svg xmlns="http://www.w3.org/2000/svg" role="img" width="3840" height="2352" viewBox="0 0 1600 980">
<title>StudyPilot learning workspace and confirmed AI workflow</title>
<rect width="1600" height="980" fill="#07090D"/>
<text x="64" y="56" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#F49B7A">StudyPilot / AI WORKFLOW</text>
