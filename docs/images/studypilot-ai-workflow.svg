<text x="1296" y="609" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#C3CCDA">Version + receipt</text>
<rect x="64" y="716" width="724" height="166" rx="18" fill="#11151D" stroke="#394456"/>
<text x="90" y="742" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#FAFBFF">Your decision comes first</text>
<text x="90" y="788" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#C3CCDA">A chat message does not apply changes.</text>
<text x="90" y="821" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#C3CCDA">The proposal card requires explicit approval.</text>
<rect x="812" y="716" width="724" height="166" rx="18" fill="#11151D" stroke="#394456"/>
<text x="838" y="742" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#FAFBFF">Your records stay accurate</text>
<text x="838" y="788" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#C3CCDA">Plans and estimates are not actual study.</text>
<text x="838" y="821" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#C3CCDA">Log what happened, then track progress.</text>
<text x="64" y="925" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#C3CCDA">Server-side validation  /  Version checks  /  Execution receipts</text>
<text x="64" y="954" dominant-baseline="text-before-edge" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#C3CCDA">WORKFLOW DIAGRAM  /  Illustrative elements; no live account data.</text>
</svg>
