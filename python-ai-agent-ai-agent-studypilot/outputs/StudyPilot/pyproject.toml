[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-web"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.3",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
local = ["streamlit==1.65.0"]

[project.scripts]
studypilot = "studypilot.cli:main"

[tool.setuptools]
packages = ["studypilot"]
include-package-data = false

[tool.vercel]
entrypoint = "studypilot.web:app"
