<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <title>StudyPilot · 把想学的变成做到的</title>
  <link rel="stylesheet" href="/study.css">
  <script src="/motion.js" defer></script>
  <script src="/study.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="/">↗ StudyPilot<span>.</span></a>
      <div class="header-side"><span class="quiet">每一步，都算数</span><div class="theme-switch" aria-label="界面模式">
        <button type="button" data-theme-choice="light" aria-label="亮色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="深色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg></button>
      </div></div>
    </header>
    <div id="account-bar"></div>
    <nav id="navigation" aria-label="页面导航" hidden></nav>
    <div id="notice" role="status" aria-live="polite"></div>
    <main id="content"><div class="loading">正在打开你的学习空间…</div></main>
    <footer><span class="brand-small">StudyPilot.</span><span>目标由你决定 · 修改需确认</span><span>v0.5.0</span></footer>
  </div>
  <noscript>StudyPilot 网页版需要启用 JavaScript。你也可以使用本地 Streamlit 版。</noscript>
</body>
</html>
