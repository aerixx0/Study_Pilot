<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="使用 StudyPilot 管理学习目标、任务与每周计划，记录学习时间，清晰掌握进度。">
  <title>StudyPilot · 把想学的变成做到的</title>
  <link rel="stylesheet" href="/study.css?v=languages-2">
  <script src="/i18n.js?v=languages-2" defer></script>
  <script src="/motion.js?v=languages-2" defer></script>
  <script src="/study.js?v=languages-2" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="/">↗ StudyPilot<span>.</span></a>
      <div class="header-side"><span class="quiet" data-i18n="每一步，都算数">每一步，都算数</span><div class="language-switch" role="group" aria-label="Language / 语言"><button type="button" data-language-choice="zh-CN" aria-label="简体中文" lang="zh-CN">中文</button><button type="button" data-language-choice="en" aria-label="English" lang="en">EN</button></div><div class="theme-switch" aria-label="界面模式" data-i18n-aria="界面模式">
        <button type="button" data-theme-choice="light" aria-label="亮色模式" data-i18n-aria="亮色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="深色模式" data-i18n-aria="深色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg></button>
      </div></div>
    </header>
    <div id="account-bar"></div>
    <div id="conversation-sidebar-tools" hidden>
      <span class="sidebar-caption" data-i18n="学习工作台">学习工作台</span>
      <button type="button" class="new-conversation" data-action="clear-chat"><span aria-hidden="true">＋</span><span data-i18n="新对话">新对话</span></button>
    </div>
    <nav id="navigation" aria-label="页面导航" data-i18n-aria="页面导航" hidden></nav>
    <button type="button" id="workspace-menu" data-action="toggle-sidebar" aria-label="展开导航" data-i18n-aria="展开导航" aria-expanded="false" hidden>☰</button>
    <button type="button" id="sidebar-backdrop" data-action="toggle-sidebar" aria-label="收起导航" data-i18n-aria="收起导航" hidden></button>
    <div id="conversation-topbar" hidden><span><span data-i18n="对话">对话</span><span class="topbar-dot">·</span><small>StudyPilot</small></span><button type="button" class="btn small" data-page="overview"><span data-i18n="返回概览 ">返回概览 </span><span aria-hidden="true">↗</span></button></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <main id="content"><div class="loading" data-i18n="正在打开你的学习空间…">正在打开你的学习空间…</div></main>
    <footer><span class="brand-small">StudyPilot.</span><span data-i18n="学习目标 · 任务计划 · 进度记录">学习目标 · 任务计划 · 进度记录</span><span data-i18n="专注每一次进步">专注每一次进步</span></footer>
  </div>
  <noscript>请启用 JavaScript 后使用 StudyPilot。 Please enable JavaScript to use StudyPilot.</noscript>
</body>
</html>
